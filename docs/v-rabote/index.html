<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>В работе — Ивентология</title>
  <meta name="description" content="Проекты в работе — черновики и прототипы Ивентологии.">
  <meta name="theme-color" content="#F74200">
  <link rel="canonical" href="https://aaateh.github.io/eventologia-design-systems/v-rabote/">
  <link rel="icon" href="../assets/favicon.ico" sizes="16x16 32x32 48x48">
  <style>
    :root {
      --orange: #F74200;
      --ink: #1A1A1A;
      --muted: #6B6763;
      --paper: #FFFFFF;
      --line: #E4E0DC;
      --surface: #F7F5F3;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      padding: 48px 20px 72px;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    .eyebrow {
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--orange);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 7vw, 44px);
      line-height: 1.1;
      letter-spacing: -.02em;
      font-weight: 700;
    }
    .lead {
      margin: 0 0 36px;
      color: var(--muted);
      font-size: 17px;
    }
    .card {
      display: block;
      padding: 24px 26px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: border-color .18s ease, background-color .18s ease, transform .18s ease;
    }
    .card:hover,
    .card:focus-visible {
      border-color: var(--orange);
      background: #FFF8F5;
      transform: translateY(-2px);
    }
    .card:focus-visible {
      outline: 3px solid var(--orange);
      outline-offset: 3px;
    }
    .card__kicker {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--orange);
    }
    .card__title {
      display: block;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .card__text {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }
    .card__go {
      display: inline-block;
      margin-top: 16px;
      font-size: 15px;
      font-weight: 600;
      color: var(--orange);
    }
    .card__go::after { content: " →"; }
    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      font-size: 14px;
      color: var(--muted);
    }
    footer a { color: var(--muted); }
    @media (prefers-reduced-motion: reduce) {
      .card, .card:hover, .card:focus-visible { transition: none; transform: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Ивентология</p>
    <h1>В работе</h1>
    <p class="lead">Проекты в работе — черновики и прототипы</p>

    <a class="card" href="eventologia-production/">
      <span class="card__kicker">Сайт</span>
      <span class="card__title">Ивентология Продакшн</span>
      <span class="card__text">Продающая страница продакшн-направления: форматы, услуги, команда и заявка.</span>
      <span class="card__go">Открыть страницу</span>
    </a>

    <footer>
      <a href="../">Дизайн-системы Ивентологии</a>
    </footer>
  </main>
</body>
</html>
